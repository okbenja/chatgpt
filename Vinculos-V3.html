@charset "UTF-8";

:root {
  --forest: #193d36;
  --forest-deep: #14332d;
  --green: #46705b;
  --sage: #dce8d5;
  --sage-light: #edf3e8;
  --cream: #f6f7f2;
  --paper: #fff;
  --ink: #263d35;
  --muted: #788178;
  --line: #e5e8df;
  --peach: #f7e4d3;
  --lavender: #e9e4f1;
  --gold: #c3924d;
  --radius: 18px;
  --shadow: 0 7px 24px #20372d05;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--ink);
  font-synthesis: none;
  text-rendering: optimizeLegibility;
  -webkit-font-smoothing: antialiased;
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--cream); font-size: 14px; line-height: 1.55; }
button, input, select, textarea { font: inherit; }
button { cursor: pointer; color: inherit; }
button, a, input, select, textarea { -webkit-tap-highlight-color: transparent; }
button { border: 0; }
button:disabled { cursor: not-allowed; opacity: .45; }
button, a { touch-action: manipulation; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid #bd8e46; outline-offset: 4px; }
input:focus, select:focus, textarea:focus { border-color: #759578; }
svg { display: block; max-width: 100%; }
img { max-width: 100%; }
a { color: inherit; text-decoration: none; }
h1, h2, h3, p { margin: 0; }
[hidden] { display: none !important; }
[data-icon] { display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; vertical-align: middle; }
[data-icon] svg, .icon { width: 19px; height: 19px; flex-shrink: 0; }
main:focus { outline: none; }
::selection { color: var(--forest); background: #dce8c8; }

.app-shell { min-height: 100vh; }
.sidebar { width: 238px; height: 100vh; position: fixed; inset: 0 auto 0 0; display: flex; flex-direction: column; padding: 29px 18px 17px; background: var(--forest); color: #c6d8c9; z-index: 20; overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 10px; color: #f4f7e8; padding: 0 12px; font: 600 32px/1 Georgia, "Times New Roman", serif; letter-spacing: -1.2px; }
.brand-symbol { width: 34px; height: 36px; border: 1px solid #93ad8560; border-radius: 11px; color: #dce8c6; font-style: italic; display: grid; place-items: center; font-size: 29px; letter-spacing: -4px; padding-right: 3px; }
.brand-dot { color: #d3cba1; }
.sidebar-tagline { font-size: 8px; letter-spacing: 1.55px; color: #9eb6a4; margin: 14px 0 25px 13px; white-space: nowrap; }
.save-indicator { display: flex; align-items: center; gap: 7px; padding: 11px 12px; background: #f3ffe506; border: 1px solid #9eb6a41a; border-radius: 8px; margin: 0 9px 34px; color: #afc6b5; font-size: 10px; }
.save-indicator > span:first-child { display: block; width: 5px; height: 5px; background: #aac892; box-shadow: 0 0 0 3px #aac89210; border-radius: 50%; flex-shrink: 0; }
.nav-caption { font-size: 9px; font-weight: 600; letter-spacing: 1.8px; color: #92aa99; margin: 0 16px 13px; }
.nav-list { display: grid; gap: 6px; }
.nav-item { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 15px; text-align: left; background: transparent; border-radius: 9px; color: #bfd1c5; font-size: 12px; font-weight: 500; transition: background .18s, color .18s; }
.nav-item [data-icon] { opacity: .8; }
.nav-item:hover { background: #f0f8e810; color: #fff; }
.nav-item.active { background: #dce8d5; color: #25453a; }
.nav-item.active [data-icon] { opacity: 1; }
.nav-pip { margin-left: auto; width: 5px; height: 5px; background: #59795c; border-radius: 50%; }
.nav-count { margin-left: auto; color: #c3d8c7; background: #e9f1e510; font-size: 10px; min-width: 21px; padding: 1px 5px; border-radius: 5px; text-align: center; }
.nav-item.active .nav-count { background: #bdd0b3; color: var(--forest); }
.sidebar-bottom { margin-top: auto; padding-top: 36px; }
.sidebar-note { display: flex; gap: 10px; align-items: flex-start; padding: 5px 15px 28px; color: #a4baa9; }
.sidebar-note [data-icon] { margin-top: 3px; color: #a7bd86; }
.sidebar-note p { font: italic 13px/1.7 Georgia, serif; }
.small-badge { margin-left: auto; font-size: 8px; letter-spacing: .5px; border: 1px solid #93aa8840; color: #c1c59b; padding: 1px 5px; border-radius: 4px; }
.sidebar-profile { display: flex; align-items: center; gap: 10px; border-top: 1px solid #ccddc61c; width: 100%; padding: 21px 9px 2px; margin-top: 18px; background: transparent; text-align: left; color: #f0f4e9; }
.sidebar-profile > span:nth-child(2) { min-width: 0; flex: 1; }
.sidebar-profile strong { display: block; font-size: 12px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sidebar-profile small { display: block; font-size: 10px; color: #a7bdaa; margin-top: 2px; }
.sidebar-profile > [data-icon] { color: #a7bdaa; }
.sidebar-profile .avatar { width: 38px; height: 38px; border-radius: 12px; }

.workspace { margin-left: 238px; min-height: 100vh; display: flex; flex-direction: column; }
.topbar { height: 76px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; padding: 0 36px; gap: 20px; }
.breadcrumbs { display: flex; align-items: center; gap: 14px; font-size: 11px; color: #585d56; }
.breadcrumbs > span:nth-child(2) { color: #5b5f58; }
.breadcrumbs strong { font-weight: 500; color: #40574a; }
.topbar-right { display: flex; align-items: center; gap: 22px; }
.day-pill { display: flex; align-items: center; gap: 7px; color: #54614b; font-size: 11px; }
.day-pill [data-icon] svg { width: 15px; height: 15px; }
.wallet { display: flex; align-items: center; gap: 9px; padding-left: 22px; border-left: 1px solid var(--line); color: #516446; }
.wallet strong { font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.icon-button { display: inline-flex; width: 34px; height: 34px; align-items: center; justify-content: center; border-radius: 50%; background: transparent; color: #566051; transition: background .15s; }
.icon-button:hover { background: #e5eadf; }
.content-layout { width: 100%; max-width: 1600px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 29px; padding: 34px 36px 26px; flex: 1; }
#main-content { min-width: 0; }
.right-panel { padding-top: 3px; display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.app-footer { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 16px 36px; border-top: 1px solid var(--line); font-size: 9px; color: #5c6054; }
.app-footer > span:first-child { font: italic 11px Georgia, serif; }
.app-footer > span:last-child { letter-spacing: 1.05px; font-size: 8px; }

.page-heading { display: flex; justify-content: space-between; align-items: flex-end; gap: 18px; margin-bottom: 26px; }
.eyebrow, .dialog-eyebrow { display: block; color: #55604e; font-size: 9px; font-weight: 600; letter-spacing: 1.8px; text-transform: uppercase; margin-bottom: 8px; }
.page-heading h1 { font: 400 37px/1.2 Georgia, "Times New Roman", serif; letter-spacing: -1.2px; color: #294634; }
.page-intro { color: #565e51; font-size: 12px; margin-top: 8px; line-height: 1.7; }
.heading-actions { flex-shrink: 0; display: flex; gap: 8px; align-items: center; padding-bottom: 5px; }
.button { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 11px 18px; border: 1px solid transparent; border-radius: 8px; font-size: 11px; font-weight: 600; line-height: 1.4; transition: background .18s, box-shadow .18s, transform .18s; text-decoration: none; }
.button:not(:disabled):hover { transform: translateY(-1px); }
.button.primary { background: var(--forest); color: #f4f5e9; box-shadow: 0 3px 6px #193d3610; }
.button.primary:not(:disabled):hover { background: #295647; box-shadow: 0 5px 12px #193d361c; }
.button.secondary { border-color: #dce3d3; color: #496247; background: #fff; }
.button.secondary:hover { background: #edf3e8; }
.button.ghost { color: #526448; background: #edf2e6; }
.button.ghost:hover { background: #e0e9d7; }
.button.danger { color: #844e3e; border-color: #edd6ce; background: #fff6f2; }
.button.danger:hover { background: #f7e6df; }
.button.small { min-height: 30px; padding: 6px 11px; font-size: 10px; border-radius: 6px; }
.button [data-icon] svg { width: 15px; height: 15px; }
.text-button, .section-link { display: inline-flex; align-items: center; gap: 7px; color: #506440; background: transparent; font-size: 10px; padding: 0; }
.text-button:hover, .section-link:hover { color: #244737; }
.text-button [data-icon] svg, .section-link [data-icon] svg { width: 14px; height: 14px; }
.section-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 15px; }
.section-heading h2 { font: 500 17px/1.4 Georgia, serif; color: #364c3b; }
.section-heading > [data-icon] { color: #54604a; }
.section-heading > [data-icon] svg { width: 16px; height: 16px; }
.tiny-label { color: #586052; font-size: 7px; letter-spacing: 1px; font-weight: 600; }
.panel-subtitle { margin: -7px 0 20px; color: #585e52; font-size: 10px; }

.hero-card { min-height: 260px; display: flex; position: relative; overflow: hidden; isolation: isolate; background: #e6eddd; border: 1px solid #e0e7d4; border-radius: var(--radius); margin-bottom: 29px; }
.hero-copy { padding: 30px 29px 26px; position: relative; z-index: 2; width: 58%; display: flex; flex-direction: column; align-items: flex-start; }
.location-tag { display: inline-flex; align-items: center; gap: 6px; border: 1px solid #a7b78d50; background: #f1f5e67d; padding: 4px 8px; color: #51623e; border-radius: 5px; font-size: 8px; text-transform: uppercase; font-weight: 600; letter-spacing: 1.3px; }
.location-tag [data-icon] svg { width: 11px; height: 11px; }
.hero-copy h2 { margin-top: 16px; font: 400 29px/1.15 Georgia, serif; letter-spacing: -.7px; color: #3c573e; }
.hero-copy > p { font-size: 11px; color: #56624d; line-height: 1.8; margin: 12px 0 17px; max-width: 275px; }
.hero-copy .button { margin-top: auto; min-height: 35px; padding: 8px 13px; font-size: 10px; }
.hero-meta { display: flex; gap: 10px; align-items: center; font-size: 9px; color: #55614b; margin-top: 14px; }
.hero-meta > span { display: inline-flex; align-items: center; gap: 4px; }
.hero-meta [data-icon] svg { width: 12px; height: 12px; }
.hero-scene { position: absolute; top: 0; bottom: 0; right: 0; width: 48%; display: flex; justify-content: center; align-items: flex-end; opacity: .96; }
.hero-scene svg { width: 100%; height: 100%; object-fit: cover; }
.hero-scene:after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg,#e6eddd 0%,#e6eddd00 22%); pointer-events: none; }

.location-grid, .people-grid, .family-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 13px; margin-bottom: 28px; }
.location-card { border: 1px solid var(--line); background: #fff; border-radius: 12px; padding: 17px 16px 13px; text-align: left; width: 100%; box-shadow: var(--shadow); position: relative; transition: border-color .18s, transform .18s, box-shadow .18s; overflow: hidden; }
.location-card:hover { transform: translateY(-3px); border-color: #b7c5a6; box-shadow: 0 8px 20px #193d360a; }
.location-card.current, .location-card.selected { border-color: #a6ba90; background: #f3f7ed; }
.location-card-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 13px; }
.location-icon { width: 35px; height: 35px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; background: #edf1e5; color: #546449; }
.location-card:nth-child(2n) .location-icon { background: #f5e9dc; color: #735a40; }
.location-card:nth-child(3n) .location-icon { background: #ece9f1; color: #665a70; }
.location-card h3 { font-size: 12px; font-weight: 600; color: #455640; margin-bottom: 6px; }
.location-card p { font-size: 10px; line-height: 1.7; color: #5c6156; margin: 0 0 13px; }
.location-footer { border-top: 1px solid #edf0e7; padding-top: 10px; display: flex; align-items: center; justify-content: space-between; gap: 7px; font-size: 9px; color: #586050; }
.location-footer [data-icon] svg { width: 13px; height: 13px; }
.location-status { display: inline-flex; align-items: center; gap: 4px; color: #546445; font-size: 8px; }
.location-status:before { content: ""; width: 4px; height: 4px; background: #91a579; border-radius: 50%; }
.map-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 17px; margin-bottom: 26px; }
.map-grid .location-card { padding: 22px; }
.map-grid .location-card h3 { font: 400 21px Georgia, serif; }
.map-grid .location-card p { font-size: 11px; min-height: 35px; }
.map-grid .location-icon { width: 42px; height: 42px; }
.map-grid .location-card .hero-scene { position: relative; width: 100%; height: 130px; margin-bottom: 20px; border-radius: 8px; overflow: hidden; background: #e6eddd; }

.avatar { width: 46px; height: 46px; background: #eee7da; border-radius: 50%; overflow: hidden; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
.avatar svg { width: 100%; height: 100%; }
.person-card { display: block; text-align: left; padding: 18px 16px 15px; border: 1px solid var(--line); border-radius: 12px; background: #fff; box-shadow: var(--shadow); transition: border-color .18s, transform .18s, box-shadow .18s; width: 100%; }
.person-card:hover { border-color: #bdc8ae; transform: translateY(-3px); box-shadow: 0 8px 20px #193d360a; }
.person-top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 13px; gap: 5px; }
.person-top .avatar { width: 49px; height: 49px; }
.person-status { display: inline-flex; align-items: center; gap: 4px; font-size: 7px; color: #586051; background: #f4f6ed; padding: 3px 6px; border-radius: 4px; margin-top: 4px; }
.person-status.present { color: #4f643c; background: #eff5e6; }
.person-status.present:before { content: ""; width: 4px; height: 4px; border-radius: 50%; background: #90a76c; }
.person-name { font-weight: 600; font-size: 12px; color: #41543d; margin-bottom: 3px; }
.person-role { font-size: 9px; color: #5c6155; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.person-traits { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 11px; margin-bottom: 16px; }
.trait-chip, .interest-tag { font-size: 8px; padding: 3px 6px; background: #f4f4ef; color: #5c6053; border-radius: 4px; line-height: 1.4; }
.person-traits .trait-chip:nth-child(2n) { background: #f2eef5; color: #645a6a; }
.relationship-line { display: flex; align-items: center; justify-content: space-between; gap: 5px; color: #596051; font-size: 8px; margin-bottom: 6px; }
.relationship-line strong { font-weight: 500; font-size: 8px; }
.mini-progress { height: 3px; border-radius: 3px; background: #edf0e5; overflow: hidden; }
.mini-progress > span, .mini-progress > div { display: block; height: 100%; background: #abc094; border-radius: inherit; }
.people-toolbar { display: flex; align-items: center; gap: 14px; justify-content: space-between; margin-bottom: 23px; flex-wrap: wrap; }
.filter-tabs { display: inline-flex; flex-wrap: wrap; background: #e9eee2; padding: 4px; border-radius: 8px; gap: 3px; }
.filter-tab { border-radius: 5px; background: transparent; color: #57604c; font-size: 10px; padding: 7px 11px; }
.filter-tab.active { background: #fff; color: #466144; box-shadow: 0 1px 4px #193d3608; }
.filter-tab:hover { color: #294d39; }
.search-input { border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 10px 13px; font-size: 11px; color: #506545; width: 175px; min-height: 36px; }
.search-input::placeholder { color: #5c6054; }
.family-intro { padding: 20px 23px; background: #ece9df; border: 1px solid #e6e3d7; border-radius: 12px; color: #5a6150; font-size: 12px; line-height: 1.8; margin-bottom: 24px; }
.family-intro h2 { font: 400 22px Georgia, serif; color: #536348; margin-bottom: 8px; }
.empty-state { padding: 43px 23px; text-align: center; border: 1px dashed #d6dfca; border-radius: 12px; color: #58604e; background: #f9faf6; margin-bottom: 20px; }
.empty-state > [data-icon] { margin-bottom: 12px; color: #58604d; }
.empty-state > [data-icon] svg { width: 32px; height: 32px; }
.empty-state h3 { font: 400 21px Georgia, serif; color: #506447; margin-bottom: 8px; }
.empty-state p { font-size: 11px; max-width: 350px; margin: 0 auto; }
.empty-state .button { margin-top: 18px; }

.action-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 11px; margin-bottom: 28px; }
.action-card { display: flex; gap: 12px; width: 100%; padding: 16px; border: 1px solid var(--line); border-radius: 11px; background: #fff; text-align: left; transition: background .18s, border-color .18s; align-items: flex-start; }
.action-card:hover { background: #fbfcf7; border-color: #becaaf; }
.action-icon { width: 33px; height: 33px; display: flex; align-items: center; justify-content: center; border-radius: 9px; background: #eff2e8; color: #546047; flex-shrink: 0; }
.action-icon [data-icon] svg { width: 17px; height: 17px; }
.action-info { flex: 1; min-width: 0; }
.action-info h3 { font-size: 11px; color: #506346; font-weight: 600; margin-bottom: 4px; }
.action-info p { font-size: 9px; color: #595e51; line-height: 1.7; }
.action-meta { display: flex; align-items: center; flex-wrap: wrap; gap: 9px; margin-top: 9px; font-size: 8px; color: #526046; }
.action-meta > span { display: inline-flex; gap: 3px; align-items: center; }
.action-meta [data-icon] svg { width: 10px; height: 10px; }

.panel { padding: 21px 20px 18px; border: 1px solid var(--line); border-radius: 13px; background: #fff; box-shadow: var(--shadow); }
.panel .section-heading { margin-bottom: 22px; }
.panel .section-heading h2 { font-size: 17px; }
.wellbeing-panel .text-button { border-top: 1px solid #eff1e9; width: 100%; justify-content: space-between; padding-top: 16px; margin-top: 9px; font-size: 9px; }
.stat-row { margin-bottom: 15px; }
.stat-label { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 7px; color: #57624f; font-size: 10px; }
.stat-label > span { display: inline-flex; gap: 6px; align-items: center; }
.stat-label [data-icon] svg { width: 13px; height: 13px; }
.stat-label strong { font-size: 9px; font-weight: 500; color: #5b6151; font-variant-numeric: tabular-nums; }
.stat-track { height: 5px; background: #eff1e8; border-radius: 6px; overflow: hidden; }
.stat-fill { height: 100%; border-radius: inherit; background: #a9bf8d; transition: width .35s; }
.stat-row:nth-child(2) .stat-fill { background: #dfbb8f; }
.stat-row:nth-child(3) .stat-fill { background: #c4b7d4; }
.stat-row:nth-child(4) .stat-fill { background: #b4c9be; }
.goal-item { display: flex; gap: 10px; align-items: flex-start; border-top: 1px solid #eff1e9; padding: 13px 0; }
.goal-item:first-child { border-top: 0; padding-top: 0; }
.goal-item:last-child { padding-bottom: 0; }
.goal-icon { width: 25px; height: 25px; border-radius: 7px; background: #f3f5ec; color: #57604d; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px; }
.goal-icon [data-icon] svg { width: 13px; height: 13px; }
.goal-item.complete .goal-icon { background: #e6efdc; color: #4e653a; }
.goal-info { flex: 1; min-width: 0; }
.goal-info h3, .goal-info strong { display: block; font-size: 10px; font-weight: 500; color: #536447; margin-bottom: 3px; }
.goal-info p { color: #585f50; font-size: 8px; line-height: 1.6; }
.goal-progress { display: flex; justify-content: space-between; gap: 8px; color: #585f4c; font-size: 8px; margin-top: 7px; }
.goal-info .mini-progress { margin-top: 6px; height: 3px; }
.goal-info .button { margin-top: 8px; }
.daily-note { position: relative; padding: 24px 24px 21px; background: #ecefdf; border-radius: 13px; overflow: hidden; border: 1px solid #e7ebd7; }
.daily-note .eyebrow { font-size: 7px; letter-spacing: 1.2px; color: #596148; margin-bottom: 13px; }
.daily-note p { position: relative; font: italic 19px/1.45 Georgia, serif; color: #54613f; width: 88%; z-index: 1; }
.daily-note small { position: relative; display: block; color: #585e4b; font-size: 8px; margin-top: 18px; z-index: 1; }
.note-flower { position: absolute; right: -6px; bottom: 20px; font-size: 115px; line-height: 1; color: #dbe3c1; transform: rotate(15deg); user-select: none; }

.journal-dot { width: 9px; height: 9px; border: 2px solid #f6f7f2; background: #a7ba8e; box-shadow: 0 0 0 1px #cbd7bc; border-radius: 50%; margin-top: 5px; position: relative; z-index: 1; }

.game-dialog { width: 700px; max-width: calc(100% - 32px); max-height: calc(100dvh - 56px); margin: auto; border: 1px solid #e3e8db; border-radius: 22px; padding: 0; color: var(--ink); background: #fcfdf8; box-shadow: 0 20px 100px #12281f26; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: #cbd5be transparent; }

.dialog-close { position: absolute; right: 16px; top: 16px; z-index: 5; background: #f2f5ecdc; color: #56624e; border: 1px solid #e0e7d6; }

.dialog-body { padding: 36px; }

.creator-welcome { background: #eff3e6; padding: 30px 35px 24px; border-bottom: 1px solid #e0e7d5; }

.creator-layout { display: grid; grid-template-columns: 205px minmax(0,1fr); gap: 30px; padding: 28px 32px 0; }
.creator-preview { text-align: center; background: #ede8da; border-radius: 15px; padding: 25px 18px; align-self: start; position: sticky; top: 20px; }
.creator-avatar { width: 145px; height: 170px; overflow: hidden; display: block; margin: 9px auto 18px; border-radius: 80px 80px 30px 30px; background: #e0dac5; }
.creator-avatar svg { width: 100%; height: 100%; object-fit: cover; }
.creator-preview h3 { font: 400 22px Georgia, serif; color: #586348; margin-bottom: 6px; overflow-wrap: anywhere; }
.creator-preview p { font-size: 10px; color: #5b5e4e; }
.creator-preview .soft-badge { margin-top: 16px; background: #faf9f1b3; }
.creator-preview .eyebrow { font-size: 8px; color: #5c6050; }
.creator-form { min-width: 0; }
.form-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 13px; margin-bottom: 20px; }
.form-field { min-width: 0; display: flex; flex-direction: column; gap: 5px; }
.form-field.full { grid-column: 1 / -1; }
.form-field label, .form-field > span:first-child { color: #55614b; font-size: 10px; font-weight: 500; }
input:not([type=checkbox]):not([type=radio]):not([type=color]):not([type=range]):not([type=file]), select, textarea { width: 100%; min-height: 39px; border: 1px solid #dfe6d5; background: #fff; border-radius: 7px; color: #536444; padding: 9px 11px; font-size: 11px; outline-offset: 2px; }
input::placeholder, textarea::placeholder { color: #5a6052; }
select { cursor: pointer; }
textarea { resize: vertical; min-height: 90px; line-height: 1.7; }
input[type=color] { width: 36px; height: 32px; background: none; border: 1px solid #d9e2cd; border-radius: 5px; padding: 2px; cursor: pointer; }
input[type=checkbox], input[type=radio] { accent-color: #517547; width: 16px; height: 16px; cursor: pointer; }
input[type=range] { accent-color: #7f9d66; }

.color-options { display: flex; gap: 8px; flex-wrap: wrap; padding: 4px 2px; }

.trait-options { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 21px; }

.creator-form .path-grid { gap: 8px; }

.npc-header { display: flex; align-items: center; gap: 19px; padding-bottom: 24px; margin-bottom: 20px; border-bottom: 1px solid #e4e9dc; }
.npc-portrait { width: 85px; height: 85px; border-radius: 50%; overflow: hidden; display: flex; background: #e5dfcf; flex-shrink: 0; }
.npc-portrait svg { width: 100%; height: 100%; }
.npc-heading { flex: 1; }
.npc-heading h2 { font: 400 29px Georgia, serif; color: #48643c; margin-bottom: 6px; padding-right: 22px; }
.npc-heading p { font-size: 10px; color: #58604e; }
.npc-heading .person-traits { margin: 10px 0 0; }
.relationship-meters { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 17px; margin: 20px 0; padding: 17px 18px; border-radius: 9px; background: #f0f4e9; }
.relationship-meter { min-width: 0; }

.npc-bio { font-size: 11px; color: #555f4d; line-height: 1.85; margin-bottom: 13px; }

.interest-tag { background: #eee9df; color: #645c49; padding: 4px 8px; }
.npc-section-title { display: flex; align-items: center; gap: 8px; font-size: 10px; font-weight: 600; color: #526045; margin: 20px 0 12px; }
.interaction-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 8px; }
.interaction-button { display: flex; align-items: center; gap: 10px; padding: 12px 13px; border: 1px solid #e1e7d7; border-radius: 9px; background: #fff; color: #536145; font-size: 10px; text-align: left; transition: background .15s, border-color .15s; }
.interaction-button:hover { border-color: #b3c59e; background: #f3f7ec; }
.interaction-button small { display: block; color: #5a6051; font-size: 8px; margin-top: 2px; }
.interaction-icon { color: #58614e; display: flex; }
.interaction-icon [data-icon] svg { width: 17px; height: 17px; }
.interaction-button .badge { margin-left: auto; }
.dialogue-bubble { position: relative; background: #eaf1df; border: 1px solid #dde7ce; border-radius: 11px; padding: 17px 20px; color: #546444; font-size: 11px; line-height: 1.8; margin: 18px 0; animation: message-in .25s ease-out; }
.dialogue-bubble:before { content: "“"; position: absolute; right: 15px; top: 4px; font: 400 50px Georgia, serif; color: #d8e2c6; }
.dialogue-bubble p { position: relative; }
.dialogue-bubble.error { background: #f8eee4; color: #6c5841; border-color: #efdfce; }
.dialogue-bubble.error:before { color: #ebd8c1; }
.dialogue-bubble.success { background: #e9f1de; color: #516340; }
.dialogue-speaker { display: block; font-size: 8px; font-weight: 600; text-transform: uppercase; letter-spacing: .8px; margin-bottom: 7px; color: #546047; }
.dialogue-bubble.error .dialogue-speaker { color: #6d5c45; }
.dialogue-bubble .button { margin-top: 10px; }
.dialogue-bubble small { display: block; color: inherit; opacity: .8; font-size: 9px; margin-top: 6px; }

.cheat-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 11px; margin: 22px 0; }
.cheat-card { display: flex; align-items: flex-start; gap: 10px; padding: 17px; text-align: left; border: 1px solid #e3dfeb; border-radius: 11px; background: #f4f0f7; color: #685a72; transition: border-color .15s, background .15s; }
.cheat-card:hover { background: #ece5f2; border-color: #c9bad5; }
.cheat-card h3 { font-size: 11px; font-weight: 500; color: #695975; margin-bottom: 5px; }
.cheat-card p, .cheat-card small { color: #655b6c; font-size: 9px; }
.toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 16px; border: 1px solid #e0e6d6; border-radius: 10px; background: #f2f5ec; margin: 17px 0; }
.toggle-row label, .toggle-row strong { font-size: 11px; font-weight: 500; color: #546447; }
.toggle-row p { font-size: 9px; color: #585f4e; margin-top: 3px; }
.toggle-row input[type=checkbox] { width: 19px; height: 19px; flex-shrink: 0; }
.settings-section { border-top: 1px solid var(--line); padding-top: 20px; margin-top: 21px; }
.settings-section h3 { font: 400 19px Georgia, serif; color: #516448; margin-bottom: 9px; }
.settings-section p { font-size: 10px; color: #575e4f; line-height: 1.8; margin-bottom: 14px; }
.settings-section .button { margin-right: 6px; margin-bottom: 8px; }
.help-list { display: grid; gap: 13px; margin-top: 22px; }
.help-item { display: flex; gap: 13px; padding: 14px 0; border-bottom: 1px solid #e6ebde; }
.help-item:last-child { border-bottom: 0; }
.help-item > [data-icon] { display: flex; align-items: flex-start; padding-top: 2px; color: #556248; }
.help-item h3 { font-size: 11px; font-weight: 500; color: #546445; margin-bottom: 4px; }
.help-item p { font-size: 10px; color: #545f4b; line-height: 1.8; }
.confirm-copy { color: #58604e; font-size: 12px; line-height: 1.85; margin: 18px 0; }
.notice { background: #eef4e5; border: 1px solid #dce7cd; border-radius: 9px; padding: 13px 16px; font-size: 10px; color: #546048; line-height: 1.8; margin: 18px 0; }
.notice-warning { background: #faf1e5; border: 1px solid #efdfc7; color: #695b43; }
.toast-container { position: fixed; left: 50%; bottom: 27px; transform: translateX(-50%); z-index: 200; width: min(420px,calc(100% - 40px)); display: grid; gap: 9px; pointer-events: none; }
.toast { display: flex; align-items: flex-start; gap: 12px; background: var(--forest); color: #e4ebd8; padding: 16px 18px; border: 1px solid #71906b; border-radius: 12px; box-shadow: 0 7px 40px #193d362d; font-size: 11px; line-height: 1.7; animation: toast-in .25s ease-out; pointer-events: auto; }
.toast-icon { display: flex; color: #b9cea1; margin-top: 1px; flex-shrink: 0; }
.toast-icon svg { width: 18px; height: 18px; }
.toast-text { flex: 1; }
.toast-text strong { display: block; font-size: 11px; margin-bottom: 2px; font-weight: 600; color: #f0f4e4; }
.toast.error { background: #6b5140; border-color: #97725b; color: #eedfc9; }
.toast.error .toast-icon { color: #ddbd93; }
.toast.success { background: #345640; border-color: #5b8055; }
.noscript-notice { position: fixed; inset: auto 0 0; padding: 24px; background: var(--forest); color: #fff; z-index: 250; text-align: center; }

@keyframes dialog-in { from { opacity: 0; transform: translateY(12px) scale(.99); } to { opacity: 1; transform: translateY(0) scale(1); } }
@keyframes message-in { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
@keyframes toast-in { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

  .workspace { margin-left: 0; }
  .topbar { height: 58px; padding: 0 22px; }
  .breadcrumbs { gap: 8px; font-size: 10px; }
  .topbar-right { gap: 12px; }
  .wallet { padding-left: 11px; gap: 6px; }

  .wallet [data-icon] svg { width: 15px; height: 15px; }
  .day-pill { font-size: 9px; }
  .topbar .icon-button { width: 23px; height: 23px; }
  .topbar .icon-button svg { width: 16px; height: 16px; }
  .content-layout { padding: 26px 22px; gap: 24px; }
  .app-footer { padding: 15px 22px; }
  .app-footer > span:last-child { font-size: 6px; letter-spacing: .6px; }

    save() {

    load() {

      }

      try {
        const input = JSON.parse(text);
        const state = this._validatedState(input);
        this.state = state;
        this._trackBaseline();
        if (input.version < state.version) {
          this._legacyMigrationText = text;
          if (!this.save()) this.loadError = 'Tu partida antigua se ha abierto de forma segura, pero no se pudo guardar la actualización. El original se conserva; libera espacio o exporta una copia.';
        }
        return true;
      } catch (_) {
        this.corruptSave = true;
        this.loadError = 'El guardado local está dañado o no es compatible. Se ha conservado: importa una copia válida o reinicia la partida para volver a guardar.';
        return false;
      }
    }

    reset() {
      try { if (this.storage) this.storage.removeItem(SAVE_KEY); } catch (_) { /* La sesión sigue siendo reiniciable sin almacenamiento. */ }

      this.loadError = null;
      this.corruptSave = false;
      this._trackedSnapshot = null;
      this._legacyMigrationText = null;

    getNPC(id) {
      const npc = this.data.npcs.find(person => person.id === id) || (this.state && this.state.family.children.find(person => person.id === id));
      if (!npc) return null;
      if (!this.state) return npc;
      const dynamic = this.state.npcStates[id] || {};
      const birthday = npc.birthDay || npc.birthday?.day || this._birthday(id);
      const elapsed = npc.child ? Math.floor((this.state.day - npc.bornOn) / 360) : Math.floor((this.state.day + 360 - birthday) / 360) - (birthday === 1 ? 1 : 0);
      return { ...npc, age: npc.child ? Math.max(0, elapsed) : npc.age + elapsed, mood: dynamic.mood ?? 60, needs: { support: 50, space: 50, ...(dynamic.needs || {}) }, movedTo: dynamic.movedTo || null, birthDay: birthday };
    }
    getRelationship(id) { return this.state && this.state.relationships[id] || null; }
    getLocationAvailability(id, hour = this.state ? this.state.hour : 9) {
      const place = this.data.locations.find(location => location.id === id);
      if (!place) return { open: false, reason: 'Ese lugar no existe.', opensAt: 9, closesAt: 23 };
      const opensAt = finite(place.opensAt) ? place.opensAt : 9;

      const open = finite(hour) && hour >= opensAt && hour < closesAt;
      const time = value => `${String(Math.floor(value)).padStart(2, '0')}:${String(Math.round(value * 60) % 60).padStart(2, '0')}`;
      const base={ open, opensAt, closesAt, reason: open ? '' : hour < opensAt ? `${place.name} abre a las ${time(opensAt)}.` : `${place.name} ha cerrado. Vuelve mañana entre las ${time(opensAt)} y las ${time(closesAt)}.` };

    waitUntilOpening(id) {

    _journal(title, text, kind = 'life', meta = {}) {
      this.state.journal.unshift({ day: this.state.day, hour: this.state.hour, title, text, kind, npcId: meta.npcId || null, tags: Array.isArray(meta.tags) ? meta.tags.slice(0, 8) : [kind], eventId: meta.eventId || null });

    _effects(effects) {
      for (const [key, value] of Object.entries(effects || {})) {

    performAction(id) {

    interact(npcId, type, option) {

      if (!npc || npc.family || npc.child || npc.age < 18 || npc.available === false) return [];

        const check = this._nightCheck(npcId, action);
        return { ...action, available: check.ok, reason: check.ok ? '' : check.message };
      });
    }

    interactNight(npcId, type, options = {}) {
      const action = (this.data.nightInteractions || []).find(item => item.id === type && NIGHT_ACTIONS.includes(type));
      if (!action) return fail('Ese plan de ocio no está disponible.');
      const checked = this._nightCheck(npcId, action);
      if (!checked.ok) return checked;
      const { npc, rel } = checked;
      const committed = this.data.npcs.find(person => person.id !== npcId && this.getRelationship(person.id).status === 'partner');
      const romantic = ['casualFlirt', 'oneNight'].includes(type);
      if (romantic && committed && options.allowInfidelity !== true) return { ok: false, message: `Tienes un acuerdo exclusivo con ${committed.name}. Continuar sería una infidelidad.`, requiresInfidelityConfirmation: true, partnerId: committed.id };
      if (type === 'oneNight' && options.confirmEncounter !== true) return { ok: false, message: 'Confirma que quieres compartir este encuentro y que ambos habéis expresado lo mismo.', requiresEncounterConfirmation: true, npcId };

      // El consentimiento y el tipo de plan se registran separados del interés romántico.
      const casual = rel.casual || (rel.casual = freshCasual());
      let title = action.label, dialogue = '', message = '', attraction = 0;
      const changes = { friendship: 0, trust: 0 };
      const effects = { energy: -action.energy, mood: 2, social: 1 };
      switch (type) {
        case 'offerDrink':
          changes.friendship = 1;
          dialogue = 'Gracias. Me apetece una bebida sin alcohol. Y después ya veremos qué plan nos gusta a cada uno.';
          message = `Invitas a ${npc.name} a una bebida que elige libremente. Compartirla no implica ninguna otra obligación.`;
          break;
        case 'danceTogether':
          changes.friendship = 1; attraction = npc.casualInterest && casual.expectations !== 'declined' ? 6 : 0;
          effects.mood = 5;
          dialogue = 'Una canción, sí. Si me apetece parar, te lo digo; haz lo mismo conmigo.';
          message = `Compartes una canción con ${npc.name}, cuidando el espacio y las ganas de ambos.`;
          break;
        case 'talkExpectations':
          if (npc.casualInterest && npc.mood >= 35 && !rel.boundary) {
            casual.expectations = 'casual'; attraction = 8;
            dialogue = 'Ahora me apetece algo casual, sin promesas de pareja. Si seguimos, quiero que ambos podamos decir qué sí y qué no.';
            message = `Tú y ${npc.name} aclarais que buscáis un encuentro casual. Hablarlo no os obliga a seguir.`;
          } else {
            casual.expectations = 'declined'; casual.attraction = 0;
            dialogue = npc.dialogue?.boundary || 'No busco un encuentro casual. Prefiero que respetemos que hoy queremos cosas distintas.';
            message = `${npc.name} deja claro que no quiere un encuentro casual. Aceptas la respuesta sin convertirla en un reto.`;
          }
          changes.trust = 1;
          break;
        case 'casualFlirt':
          if (npc.mood < 35) {
            casual.expectations = 'declined'; casual.attraction = 0;
            dialogue = 'Hoy no me apetece seguir por ahí. Gracias por escucharlo sin insistir.';
            message = `Expresas atracción y ${npc.name} prefiere parar. Su respuesta se mantiene y no supone una deuda contigo.`;
          } else {
            attraction = 12; effects.mood = 4;
            dialogue = npc.dialogue?.flirt || 'Sí, hay atracción. Me gusta que no intentemos convertirla en una promesa que no queremos hacer.';
            message = `Expresas atracción por ${npc.name} sin fingir un proyecto de pareja. La atracción es mutua y podéis elegir vuestro ritmo.`;
          }
          break;
        case 'oneNight':
          title = 'Una noche compartida';
          casual.encounters++; casual.lastEncounterDay = this.state.day;
          this.state.daily.actions.casualEncounter = 1;
          this.state.narrative.flags.casual_experience = true;
          this.state.narrative.flags.casual_last_encounter_day = this.state.day;
          effects.mood = 8; effects.stress = -4;
          dialogue = 'Me apetece compartir este momento contigo, con los límites que hemos hablado. No lo voy a convertir en una promesa de mañana.';
          message = `Tú y ${npc.name} elegís compartir un encuentro íntimo. Acordáis límites y podéis cambiar de opinión. La escena queda fuera de pantalla; después, os despedís sin asumir compromiso sentimental.`;
          break;
        case 'sayGoodbye':
          effects.stress = -2;
          dialogue = 'Lo he pasado bien. Que termine aquí no le quita valor, y no tenemos que prometer repetir.';
          message = `Te despides de ${npc.name} con claridad. Cerráis el momento sin convertirlo automáticamente en romance ni en una cita pendiente.`;
          break;
        case 'exchangeContact':
          changes.trust = 1;
          dialogue = ['declined', 'romantic'].includes(casual.expectations) ? 'Podemos seguir en contacto como amistad, sin cambiar el límite que ya hemos hablado.' : 'Podemos intercambiar contacto. Eso no significa que ninguno de los dos deba otro encuentro.';
          message = `Preguntas a ${npc.name} si quiere intercambiar contacto. Acordáis que escribir o responder seguirá siendo una elección.`;
          break;
        case 'declineCasual':
          casual.expectations = 'declined'; casual.attraction = 0;
          effects.stress = -3;
          dialogue = 'Entendido. Gracias por decir qué te apetece. Podemos cambiar de plan o despedirnos, sin más.';
          message = `Dices que no te apetece un encuentro casual con ${npc.name}. Tu decisión se respeta, sin penalizar el vínculo.`;
          break;
      }
      casual.attraction = Math.round(clamp(casual.attraction + attraction));
      if (romantic && committed && casual.expectations !== 'declined') {
        if (!this.state.narrative.flags.secret_affair && !this.state.narrative.queue.some(item => item.eventId === 'secreto_pesa')) this.state.narrative.queue.push({ eventId: 'secreto_pesa', dueDay: this.state.day + 2, sourceEventId: null, npcId: committed.id });
        this.state.narrative.flags.secret_affair = true;
        this.state.narrative.flags.affair_partner = committed.id;
        this.state.narrative.flags.affair_target = npcId;
        effects.stress = (effects.stress || 0) + 6;
        message += ' Decides ocultarlo a tu pareja y rompes vuestro acuerdo de exclusividad.';
      }
      this.state.money -= action.cost || 0;
      this._effects(effects); this._advance(action.duration);
      this._updateRelationship(npc, changes);
      this.state.daily.interactions[npcId] = (this.state.daily.interactions[npcId] || 0) + 1;
      this.state.daily.actions[`night_${npcId}_${type}`] = (this.state.daily.actions[`night_${npcId}_${type}`] || 0) + 1;
      this.state.counters.social++;
      const entry = { day: this.state.day, hour: this.state.hour, type, title, text: message };
      casual.history.push(entry); casual.history = casual.history.slice(-40);
      rel.sharedHistory.push({ day: entry.day, type, title, text: message }); rel.sharedHistory = rel.sharedHistory.slice(-30);
      this._journal(`${title} · ${npc.name}`, message, 'social', { npcId, tags: ['noche', 'casual', type] });
      return this._success(message, { title, dialogue, npcId, changes, casual: { ...casual }, duration: action.duration, cost: action.cost || 0, kind: 'social' });
    }

    sleep() {
      if (!this.state) return fail('Crea tu personaje para comenzar.');
      const pending = this._eventBlock(true);
      if (pending) return pending;
      const oldDay = this.state.day;
      if(this.state.direction)this._system('beforeSleep');
      if (this.state.family.expenses > 0) {
        const factor=this.state.direction?this.data.difficulties.find(d=>d.id===this.state.direction.settings.difficulty).costFactor:1;
        const paid = Math.min(this.state.money, Math.round(this.state.family.expenses*factor));
        this._effects({ money: -paid });
        if (paid < Math.round(this.state.family.expenses*factor)) this.state.family.tension = clamp(this.state.family.tension + 3);
        this._recordMutation(`Reservas ${paid} € para los cuidados de la familia.`, { kind: 'family' });
        this._trackBaseline();
      }
      const summary = this.getDaySummary();
      if(this.state.direction)this._system('afterSummary',[summary]);
      this.state.summaries.push(summary);
      this.state.summaries = this.state.summaries.slice(-720);
      this._journal(`Así fue el día ${oldDay}`, `${summary.actions.length ? `Viviste ${summary.actions.length} momentos: ${summary.actions.slice(0, 3).join(' ')}` : 'Te diste tiempo para descansar y observar.'} Tu saldo cambió ${summary.moneyChange >= 0 ? '+' : ''}${summary.moneyChange} €. ${summary.highlight} ${summary.sustainability || ''}`, 'summary', { tags: ['resumen', this.getCalendar().season] });
      this.state.day++;
      this.state.hour = 9;
      this.state.location = 'casa';
      this.state.daily = { interactions: {}, actions: {}, workHours: 0, gifts: {} };
      this._effects({ energy: 100, health: this.state.stats.stress > 80 ? -3 : 1, stress: -22, mood: 5 });
      // El ánimo, la salud y las habilidades necesitan atención continuada, no una barra permanente.
      this._effects({mood:-4,health:-3,...(this.state.direction?{social:this.state.stats.social>25?-1:0,knowledge:this.state.stats.knowledge>75?-1:this.state.stats.knowledge>30&&this.state.day%7===0?-1:0,charm:this.state.stats.charm>70?-1:this.state.stats.charm>35&&this.state.day%7===0?-1:0,responsibility:this.state.stats.responsibility>75?-1:this.state.stats.responsibility>45&&this.state.day%7===0?-1:0}:{social:-3,knowledge:-1,charm:-1,responsibility:-1})});
      // El paso del tiempo solo desgasta vínculos descuidados; nunca toma decisiones por el jugador.
      for (const npc of this.data.npcs) {
        const rel = this.getRelationship(npc.id);
        if (!npc.family && rel.lastMet && this.state.day - rel.lastMet > 4 && rel.friendship > 10) {
          rel.friendship = Math.max(10, rel.friendship - (this.state.day % 2 === 0 ? 1 : 0));
          if (rel.status === 'friend' && rel.friendship < 40) rel.status = 'acquaintance';
        }
      }
      this._npcNewDay();
      if(this.state.direction)this._system('newDay');
      this._beginDay();
      this._trackBaseline();
      const events = [
        'Tu madre deja una nota en la cocina: «Tienes comida en casa. No te olvides de cuidarte».',
        'La plaza amanece tranquila. Hoy puede ser un buen día para conocer mejor a alguien.',
        'Tu familia propone buscar un rato para conversar. Tú decides cuándo acercarte.',
        'Encuentras tu libreta abierta en un proyecto pendiente. Cada pequeño paso cuenta.',
        'La ciudad empieza otra mañana. No hace falta resolver toda tu vida hoy.'
      ];
      const event = this.isWeekend() ? 'Es fin de semana: las clases y la oficina descansan. Hay tiempo para tus vínculos y para ti.' : events[(this.state.day - 1) % events.length];
      this._journal(`Día ${this.state.day} · Un nuevo comienzo`, event, 'day');
      return this._success(`Descansas después del día ${oldDay}. Tu energía se recupera. ${event}`, { title: `Buenos días · ${this.getWeekday()}`, summary, kind: 'day' });
    }

    _npcNewDay() {
      let sent = 0;
      for (const npc of this.data.npcs) {
        const dynamic = this.state.npcStates[npc.id];
        const rel = this.getRelationship(npc.id);
        dynamic.mood = clamp(dynamic.mood + Math.round(this.random() * 12 - 6));
        dynamic.needs.support = clamp(dynamic.needs.support + 4);
        dynamic.needs.space = clamp(dynamic.needs.space - 12);
        if (!npc.family && this.state.day > 10 && this.random() < 0.005) {
          const place = npc.locations[Math.floor(this.random() * npc.locations.length)];
          dynamic.movedTo = place;
          dynamic.history.push({ day: this.state.day, text: `Ahora suele pasar más tiempo en ${this.data.locations.find(location => location.id === place).name}.` });
          dynamic.history = dynamic.history.slice(-12);
        }
        if (sent >= 2 || this.state.messages.some(message => message.npcId === npc.id && !message.answered)) continue;
        if ((npc.family || rel.friendship >= 30) && this.random() < 0.14) {
          const text = dynamic.mood < 40 ? 'Hoy tengo un día un poco difícil. ¿Podemos hablar cuando tengas un rato?' : rel.lastMet && this.state.day - rel.lastMet > 3 ? 'Hace unos días que no conversamos. Me gustaría saber cómo estás.' : `Me acordé de ti al pensar en ${npc.interests[0]}. ¿Cómo va tu día?`;
          this.state.messages.push({ id: `msg_${this.state.day}_${npc.id}`, npcId: npc.id, text, day: this.state.day, answered: false });
          sent++;
        }
      }
      this.state.messages = this.state.messages.slice(-120);
    }

    replyMessage(id, option = 'warm') {
      if (!this.state) return fail('Crea tu personaje para comenzar.');
      const pending = this._eventBlock();
      if (pending) return pending;
      const message = this.state.messages.find(item => item.id === id);
      if (!message || message.answered) return fail('Este mensaje ya no espera una respuesta.');
      if (!['warm', 'honest', 'later'].includes(option)) return fail('Elige cómo quieres responder.');
      const check = this._timeCheck(0.25, option === 'later' ? 1 : 3);
      if (check) return check;
      const npc = this.getNPC(message.npcId);
      this._advance(0.25);
      this._effects({ energy: option === 'later' ? -1 : -3 });
      const direct = /direct|sincer|analít/.test(npc.traits.join(' ').toLowerCase());
      this._updateRelationship(npc, option === 'warm' ? { friendship: 3, trust: 4 } : option === 'honest' ? { friendship: 1, trust: direct ? 5 : 3 } : { trust: 1 });
      message.answered = true;
      message.reply = option;
      const text = option === 'later' ? `Explicas a ${npc.name} que necesitas tiempo y que responderás con calma más adelante.` : option === 'honest' ? `Cuentas a ${npc.name} cómo te sientes, sin fingir que todo va perfecto.` : `Respondes a ${npc.name} con interés y le preguntas cómo está.`;
      const rel = this.getRelationship(npc.id);
      rel.sharedHistory.push({ day: this.state.day, type: 'message', title: 'Un mensaje respondido', text });
      rel.sharedHistory = rel.sharedHistory.slice(-30);
      this._journal('Una conversación que continúa', text, 'social', { npcId: npc.id, tags: ['mensaje'] });
      return this._success(text, { title: 'Mensaje respondido', kind: 'social', npcId: npc.id });
    }

    addChild(name) {
      if (!this.state) return fail('Crea tu personaje para comenzar.');
      const pending = this._eventBlock();
      if (pending) return pending;
      if (typeof name !== 'string' || !name.trim()) return fail('Elige un nombre para este nuevo miembro de la familia.');
      const partner = this.data.npcs.find(npc => this.getRelationship(npc.id).status === 'partner');
      if (!partner || this.getRelationship(partner.id).trust < 70 || this.getRelationship(partner.id).dates < 3) return fail('Formar una familia requiere una pareja estable, tres citas compartidas y confianza 70.');
      if (this.state.family.children.length >= 4) return fail('Tu familia ya tiene cuatro hijos. Es momento de cuidar los vínculos que habéis construido.');
      if (this.state.money < 150) return fail('Necesitas reservar 150 € para recibir a un nuevo miembro de la familia.');
      const check = this._timeCheck(1, 10);
      if (check) return check;
      const id = `child_${this.state.day}_${this.state.family.children.length + 1}`;
      const inherited = [...new Set([this.data.traits.find(trait => trait.id === this.state.profile.traitIds[0])?.label || 'Curiosidad', partner.traits[0]])].slice(0, 2);
      const child = { id, name: cleanText(name, '', 32), lastName: this.state.profile.lastName, age: 0, pronouns: 'elle', gender: 'nonbinary', child: true, bornOn: this.state.day, birthDay: this.getCalendar().dayOfYear, family: true, relation: 'Hije', occupation: 'Nuevo miembro de la familia', bio: 'Un nuevo capítulo que habéis elegido cuidar juntos.', traits: inherited, interests: ['juegos', 'cuentos'], available: false, home: 'casa', locations: ['casa'], skin: this.state.profile.skin, hair: partner.hair, hairStyle: 'short', outfit: '#9da992', color: '#c9d6bc' };
      this.state.family.children.push(child);
      this.state.relationships[id] = { friendship: 70, trust: 70, romance: 0, status: 'family', dates: 0, boundary: false, lastMet: this.state.day, friendMilestone: false, sharedHistory: [], conflict: 0 };
      this.state.npcStates[id] = { movedTo: null, awayUntil: 0, mood: 75, needs: { support: 70, space: 20 }, history: [] };
      this.state.family.expenses += 5;
      this._effects({ money: -150, energy: -10 });
      this._advance(1);
      this._journal('La familia crece', `Por una decisión compartida y meditada, dais la bienvenida a ${child.name}. Hereda ${inherited.join(' y ').toLowerCase()} de vuestra familia.`, 'family', { npcId: id, tags: ['familia', 'ciclo_vital'] });
      return this._success(`Dais la bienvenida a ${child.name}. Este capítulo trae cuidados, gastos y nuevos recuerdos.`, { kind: 'social', npcId: id });
    }

    choosePath(path) {
      if (!this.state) return fail('Crea tu personaje para comenzar.');
      if (!PATHS.includes(path)) return fail('Elige un rumbo válido.');
      if (this.state.profile.path === path) return fail('Ya sigues este rumbo.');
      this.state.profile.path = path;
      const names = { school: 'Terminar el colegio', university: 'Estudiar en la universidad', work: 'Comenzar a trabajar', free: 'Explorar a tu ritmo' };
      this._journal('Un cambio de rumbo', `Decides: ${names[path].toLowerCase()}. Tus relaciones y tus aprendizajes te acompañan.`, 'milestone');
      return this._success(`Tu nuevo rumbo: ${names[path]}.`);
    }

    updateProfile(profile) {
      if (!this.state) return fail('Crea tu personaje para comenzar.');
      if (!isObject(profile)) return fail('Los datos del personaje no son válidos.');
      const merged = { ...this.state.profile, ...profile };
      if (typeof merged.name !== 'string' || !merged.name.trim()) return fail('Elige un nombre para tu personaje.');
      const age = Number(merged.age);
      if (!Number.isInteger(age) || age < 18 || age > 80) return fail('Tu personaje debe tener entre 18 y 80 años.');
      if (!PATHS.includes(merged.path)) return fail('Elige un rumbo válido.');
      if (Array.isArray(merged.traitIds) && merged.traitIds.length > 2) return fail('Puedes escoger hasta dos rasgos de personalidad.');
      if(this.state.direction&&profile.difficulty&&!this.data.difficulties.some(d=>d.id===profile.difficulty))return fail('Elige una dificultad válida.');
      if(this.state.direction && Array.isArray(profile.aspirationIds)){const ids=profile.aspirationIds;if(ids.length<1||ids.length>2||new Set(ids).size!==ids.length||ids.some(id=>!this.data.aspirations.some(a=>a.id===id)))return fail('Elige una o dos aspiraciones distintas.');if(ids.slice().sort().join()!==this.state.aspirations.slice().sort().join()){if(this.state.day===1&&!this.state.ledger.actions.length)this.state.aspirations=ids.slice();else{const r=this.changeAspirations(ids);if(!r.ok)return r;}}}
      if(this.state.direction&&profile.difficulty)this.state.direction.settings.difficulty=profile.difficulty;
      this.state.profile = this._profile({ ...merged, age });
      return this._success('Personaje actualizado. Tu historia y tus vínculos se conservan.',{kind:'profile'});
    }

    getGoals() {
      if (!this.state) return [];
      if(this.state.direction)return this._system('goals');
      const goals = (this.data.goals || []).map(goal => ({ ...goal, priority: goal.type === 'study' && ['school', 'university'].includes(this.state.profile.path) || goal.type === 'work' && this.state.profile.path === 'work' ? 20 : 10 }));
      if (this.state.messages.length) goals.push({ id: 'respuesta_cercana', title: 'Seguir la conversación', description: 'Responde a alguien que se ha acordado de ti.', target: 1, type: 'message', reward: 10, progress: this.state.messages.filter(message => message.answered).length, priority: 25 });
      if (this.state.family.support >= 70 || this.state.family.tension > 35) goals.push({ id: 'hogar_compartido', title: 'Un hogar que acompaña', description: 'Cuida los vínculos hasta alcanzar apoyo familiar 80.', target: 80, type: 'family', reward: 20, progress: this.state.family.support, priority: 18 });
      if (this.state.counters.work > 0) goals.push({ id: 'fondo_tranquilo', title: 'Un pequeño colchón', description: 'Reúne 200 € para tus próximos planes.', target: 200, type: 'money', reward: 15, progress: this.state.money, priority: 15 });
      return goals.map(goal => {
        const progress = Math.min(goal.target, goal.progress ?? this.state.counters[goal.type] ?? 0);
        return { ...goal, progress, complete: progress >= goal.target, claimed: this.state.claimedGoals.includes(goal.id) };
      }).sort((a, b) => Number(a.claimed) - Number(b.claimed) || b.priority - a.priority);
    }

    claimGoal(id) {
      if(this.state?.direction && id.startsWith('asp_'))return this._system('claim',[id]);
      if (!this.state) return fail('Crea tu personaje para comenzar.');
      const goal = this.getGoals().find(item => item.id === id);
      if (!goal) return fail('Ese objetivo no existe.');
      if (goal.claimed) return fail('Ya has recogido esta recompensa.');
      if (!goal.complete) return fail('Aún no has completado este objetivo.');
      this.state.claimedGoals.push(id);
      const reward = typeof goal.reward === 'number' ? goal.reward : Number(goal.reward && goal.reward.money) || 25;
      this._effects({ money: reward, mood: 5 });
      this._journal('Un paso adelante', `${goal.title}. Recibes ${reward} € por tu logro.`, 'milestone');
      return this._success(`Objetivo completado: ${goal.title}. Has recibido ${reward} €.`);
    }
    setGoalClaim(id) { return this.claimGoal(id); }

    cheat(type, value, npcId) {
      if (!this.state) return fail('Crea tu personaje para comenzar.');
      if (type === 'toggle' || type === 'enable') {
        this.state.flags.cheats = type === 'enable' ? true : !this.state.flags.cheats;
        if (this.state.flags.cheats) this.state.flags.cheatsUsed = true;
        return this._success(this.state.flags.cheats ? 'Trucos activados. Tú decides cómo jugar.' : 'Trucos desactivados.');
      }
      if (!this.state.flags.cheats) return fail('Activa los trucos para utilizar esta opción.');
      let message;
      switch (type) {
        case 'money':
          this._effects({ money: finite(value) ? Math.round(clamp(value, 0, 999999)) : 500 });
          message = 'Saldo actualizado.';
          break;
        case 'stats':
          for (const key of STATS) this.state.stats[key] = key === 'stress' ? 0 : 100;
          message = 'Estadísticas al máximo y estrés a cero.';
          break;
        case 'energy':
          this._effects({ energy: 100, stress: -100 });
          message = 'Energía recuperada y estrés a cero.';
          break;
        case 'relationship': {
          const npc = this.getNPC(npcId || value);
          if (!npc) return fail('Elige una persona.');
          const rel = this.getRelationship(npc.id);
          this._updateRelationship(npc, { friendship: 100, trust: 100 });
          message = `Afinidad y confianza con ${npc.name} al máximo. Las citas y la relación siguen siendo decisiones tuyas.`;
          break;
        }
        case 'time':
          this.state.hour = finite(value) ? Math.round(clamp(value, 8, 22) * 2) / 2 : 9;
          message = 'Hora actualizada.';
          break;
        default: return fail('Ese truco no existe.');
      }
      this.state.flags.cheatsUsed = true;
      return this._success(message);
    }

    exportSave() { return this.state ? JSON.stringify(this.state, null, 2) : ''; }

    importSave(json) {
      try {
        if (typeof json !== 'string' || json.length > 3000000) return fail('El archivo de guardado no es válido o es demasiado grande.');

  const catalogCache=new WeakMap(),historyCache=new WeakMap();

  function getEventWeights(game) {

  function optionCheck(game, option) {

  function resultWeight(game, result, npcId) {

  function simulateDays(sourceGame, requested = 30, seed = 1) {

      else if (target.id === primary.id && rel.dates >= 2 && rel.romance >= 40 && rel.trust >= 45 && rel.status !== 'partner') type = 'relationship';

        if (game.state.hour >= 22 || game.state.stats.energy <= 0) break;

        if (game.state.stats.health < 52 && game.state.money >= 6) { if (visit('casa')) perform('comer_casa'); continue; }
        if (game.state.stats.stress > 62) { if (visit('plaza')) perform('pasear_plaza'); continue; }

      const ledger = game.state.ledger || {};
      for (const [key, value] of Object.entries(game.state.stats)) {

    const host = dialog.open ? $('#dialog-content') : $('#toast-container');
    if (dialog.open) el.classList.add('dialog-toast');
    host.append(el);
    setTimeout(() => el.remove(), 5200);
  }

  function hydrateMeters(root = document) {
    $$('.stat-track,.mini-progress',root).forEach(track=>{
      const fill=track.firstElementChild;
      const value=Math.max(0,Math.min(100,parseFloat(fill?.style.width)||0));
      const label=track.previousElementSibling?.textContent.replace(/\d+(?:\/100|%)?/g,'').trim() || 'Progreso';
      track.setAttribute('role','meter');track.setAttribute('aria-label',label);
      track.setAttribute('aria-valuemin','0');track.setAttribute('aria-valuemax','100');track.setAttribute('aria-valuenow',String(value));
    });
  }

utton>'}</div></div>`, 'summary-dialog');

  function runLifeAction(button) {

  function renderMemories() {return `<section class="memory-timeline content-section"><div class="section-heading"><h2>Tu línea de tiempo</h2></div>${game.getMemories().length?game.getMemories().map(m=>`<article class="memory-card"><small>Día ${m.day} · ${formatHour(m.hour)}</small><h3>${escape(m.title)}</h3><p>${escape(m.text)}</p></article>`).join(''):'<p>Marca una estrella en el Diario para conservar un momento. Algunas historias también propondrán recuerdos por sí mismas.</p>'}</section>`;}
  function renderTrends() {
    let series=game.getTrends();if(!series.length){const links=Object.values(game.state.relationships);series=[{day:game.state.day,money:game.state.money,mood:game.state.stats.mood,relationships:links.length?links.reduce((sum,r)=>sum+r.friendship,0)/links.length:0}];}
    const stride=Math.max(1,Math.ceil(series.length/35));const points=series.filter((_,i)=>i%stride===0||i===series.length-1);
    return `<section class="trend-grid content-section">${[['mood','Ánimo','#849c72'],['money','Dinero disponible','#b29361'],['relationships','Vínculos','#9d8eaf']].map(([key,label,color])=>{const values=points.map(p=>p[key]),min=Math.min(...values),max=Math.max(...values),span=max-min||1;const coords=points.map((p,i)=>`${20+i/Math.max(1,points.length-1)*260},${86-(p[key]-min)/span*60}`).join(' ');return `<figure class="trend-card"><figcaption>${label}</figcaption><svg class="trend-svg" viewBox="0 0 300 110" role="img" aria-label="${label}: de ${Math.round(values[0])} a ${Math.round(values.at(-1))}, entre los días ${points[0].day} y ${points.at(-1).day}"><path d="M20 16v72h264" fill="none" stroke="#d5ddcd"/><polyline points="${coords}" fill="none" stroke="${color}" stroke-width="2.5"/>${points.length===1?`<circle cx="20" cy="86" r="3" fill="${color}"/>`:''}<text x="20" y="105" font-size="10" fill="#52634b">Día ${points[0].day}</text><text x="230" y="105" font-size="10" fill="#52634b">${points.at(-1).day}</text></svg><p class="chart-caption">${Math.round(values[0])} → ${Math.round(values.at(-1))}${points.length===1?' · Los próximos días ampliarán el gráfico.':''}</p></figure>`;}).join('')}</section>`;
  }
  function renderV3Settings() {

  async function syncAudio(gesture) {
    const settings=game.state.direction.settings;
    if(!settings.audioEnabled){if(audioContext)await audioContext.suspend();return;}
    if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){game.setPreferences({audioEnabled:false});const toggle=$('#sound-toggle');if(toggle)toggle.checked=false;const text=$('.sound-status');if(text)text.textContent='El ambiente queda apagado con la preferencia de movimiento reducido.';return;}
    try{const AudioAPI=window.AudioContext||window.webkitAudioContext;if(!AudioAPI)throw Error('Audio no disponible');if(!audioContext&&gesture){audioContext=new AudioAPI();ambienceGain=audioContext.createGain();ambienceGain.gain.value=settings.volume*.06;ambienceGain.connect(audioContext.destination);for(const f of [174,261]){const o=audioContext.createOscillator();o.type='sine';o.frequency.value=f;o.connect(ambienceGain);o.start();ambienceNodes.push(o);}}if(audioContext)await audioContext.resume();const text=$('.sound-status');if(text)text.textContent='Ambiente activo. Puedes bajarlo o apagarlo cuando quieras.';}catch{game.setPreferences({audioEnabled:false});toast('Este navegador no permite iniciar el sonido. Puedes seguir jugando sin él.',true);}
  }
  document.addEventListener('visibilitychange',()=>{if(document.hidden&&audioContext)audioContext.suspend().catch(()=>{});});

  function locationCard(loc, large = false) {
    const current=game.state.location===loc.id;
    const availability=game.getLocationAvailability?.(loc.id,game.state.hour+(current?0:0.5)) || {open:true};
    const hours=loc.opensAt!==undefined?`${formatHour(loc.opensAt)}–${formatHour(loc.closesAt)}`:'09:00–23:00';
    const wait=!availability.open && game.state.hour<loc.opensAt-0.5;
    return `<article class="location-card ${large?'large-location-card':''} ${current?'is-current':''} ${loc.category==='noche'?'nightlife-location':''} ${!availability.open?'is-closed':''}" data-category="${escape(loc.category || 'ciudad')}" style="--location-color:${escape(loc.color || '#e4eadf')}"><button class="location-destination" data-travel="${loc.id}" aria-label="Ir a ${escape(loc.name)}${!availability.open?', '+escape(availability.reason):''}">${large?`<div class="map-scene">${scene(loc)}</div>`:''}<div class="location-card-top"><span class="location-icon">${icon(locationIcon(loc.id))}</span>${current?'<span class="location-status">ESTÁS AQUÍ</span>':!availability.open?'<span class="location-status closed">CERRADO</span>':icon('arrow')}</div><h3>${escape(loc.name)}</h3><p>${escape(large?loc.description:locationSummary(loc.id))}</p><span class="hours-badge">${icon('clock')} ${hours}</span><div class="location-footer"><span>${availability.open?current?'Tu entorno actual':`${game.getPresentNPCs(loc.id).length} personas por aquí`:escape(availability.reason)}</span><span>${current?icon('pin'):'30 min'}</span></div></button>${wait?`<button class="text-button wait-opening" data-wait-place="${loc.id}">Esperar a la apertura ${icon('arrow')}</button>`:''}</article>`;
  }
  const locationIcon=id=>data.locations.find(l=>l.id===id)?.icon || 'pin';
  const locationSummary=id=>({casa:'Tu lugar para volver.',plaza:'Un respiro y nuevos encuentros.',cafeteria:'Buenas charlas, mejor café.',colegio:'El inicio de lo que viene.',universidad:'Ideas que abren caminos.',trabajo:'Un futuro hecho por ti.',discoteca:'La noche, a tu propio ritmo.',bar:'Una conversación sin promesas.',azotea:'Luces, aire y planes abiertos.',playa:'Sal y espacio para ti.',centrocultural:'Ideas fuera de la rutina.',restaurante:'Una mesa para elegir compañía.'}[id] || data.locations.find(l=>l.id===id)?.description);

  function navigate(next) {

  function focusSelector(el) {
    if(!el)return null;
    if(el.id)return '#'+CSS.escape(el.id);
    for(const key of ['npc','open','trait','color'])if(el.dataset?.[key])return `[data-${key}="${CSS.escape(el.dataset[key])}"]`;
    if(el.name)return `[name="${CSS.escape(el.name)}"]`;
    return null;
  }
  function openDialog(html, className = '') {
    const wasOpen=dialog.open;
    const previous=document.activeElement;
    const scroll=dialog.scrollTop;
    const selector=focusSelector(previous);
    if(!wasOpen){returnFocus=previous;returnFocusSelector=selector;}
    $('#dialog-content').innerHTML=html;
    dialog.className=`game-dialog ${className}`;
    const title=$('.dialog-title',dialog);
    if(title){title.id='dialog-title';title.tabIndex=-1;}
    if (!dialog.open) dialog.showModal();
    hydrateIcons();hydrateMeters(dialog);
    if(!wasOpen)(title || $('input,button',dialog))?.focus({preventScroll:true});
    else {const replacement=selector?$(selector,dialog):null;(replacement || title)?.focus({preventScroll:true});dialog.scrollTop=scroll;}
  }
  function closeDialog() { dialog.close(); activeNPC=null; lastDialogue=null; creatorDraft=null; }

  function handleNightAction(npcId,type,options={}) {
    const result=game.interactNight(npcId,type,options);

    if(result.requiresEncounterConfirmation){pendingNightIntent={npcId,type,options};return confirmCasualEncounter(npcId);}
    if(result.ok)pendingNightIntent=null;

n('pin')} No está en este lugar. ${at.length ? `Puedes encontrarle al llegar en ${at.map(l=>escape(l.name)).join(' o ')}.` : escape(n.schedule || 'Vuelve a buscarle en otro momento.')}</div><div class="dialog-footer">${at.map(l=>`<button class="button primary" data-visit-npc="${l.id}" data-person="${id}">Ir a ${escape(l.name)} ${icon('arrow')}</button>`).join('')}</div>` : ''}${renderNightPanel(n,r,present)}${renderPersonHistory(n,r)}<h3 class="npc-section-title">${present ? '¿Cómo quieres compartir este momento?' : 'Cuando os encontréis…'}</h3><div class="interaction-grid">${actions.map(([type,ic,label,desc])=>`<button class="interaction-button" data-interact="${type}" data-person="${id}" ${!present && !['boundary','breakup'].includes(type)?'disabled':''}><span class="interaction-icon">${icon(ic)}</span><span><strong>${label}</strong><small>${desc}</small></span></button>`).join('')}</div><p class="dialog-footnote">Cada interacción ocupa tiempo y energía. Respetar un «no» también fortalece tu historia.</p></div>`, 'npc-dialog');
