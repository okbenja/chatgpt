name: Vínculos · pruebas, descarga y Pages
on:
  push:
    branches: [main]
    paths-ignore: [DEPLOYMENT.json]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vinculos-publication
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Motor, migración, seguridad y diez años
        run: npm test
      - name: Simulación corta por aspiración
        run: npm run test:sim:smoke
      - name: Preparar Chromium para pruebas
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Escritorio, móvil y HTML sin conexión
        run: npm run test:ui
      - name: Generar entregables desde las fuentes
        run: python scripts/build-release.py --output /tmp/vinculos-release
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/vinculos-release/site
      - uses: actions/upload-artifact@v4
        with:
          name: vinculos-v4-downloads
          path: |
            /tmp/vinculos-release/Vinculos-V4.html
            /tmp/vinculos-release/Vinculos-V4.zip
            /tmp/vinculos-release/SHA256.json
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: vinculos-v4-downloads
          path: /tmp/vinculos-downloads
      - name: Publicar descarga permanente en Releases
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v4.0.0-${{ github.run_number }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" /tmp/vinculos-downloads/* --clobber
          else
            gh release create "$RELEASE_TAG" /tmp/vinculos-downloads/* --target "$GITHUB_SHA" --title "Vínculos V4" --notes-file RELEASE_NOTES.md --latest
          fi
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Leer configuración de Pages
        uses: actions/configure-pages@v5
      - name: Publicar sitio estático
        uses: actions/deploy-pages@v4
        id: deployment
  verify:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Comprobar el sitio servido y registrar evidencia
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: python scripts/verify-pages.py --url https://okbenja.github.io/chatgpt/ --commit "$SOURCE_SHA" --output DEPLOYMENT.json
      - name: Guardar comprobación sin volver a disparar el despliegue
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DEPLOYMENT.json
          if ! git diff --cached --quiet; then
            git commit -m "Registrar comprobación HTTP de GitHub Pages"
            git push origin HEAD:main
          fi
